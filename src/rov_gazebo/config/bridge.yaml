# ros_gz_bridge configuration (Gazebo Harmonic <-> ROS 2 Jazzy)
#
# Not bridged: DVL and depth. Both are emulated from ground truth by
# sensor_emulator.py (see that file for why).

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /odometry/ground_truth
  gz_topic_name: /model/rov/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# Raw IMU: Gazebo leaves orientation noiseless with zero covariance;
# sensor_emulator.py adds both and republishes on /sensors/imu.
- ros_topic_name: /sensors/imu_raw
  gz_topic_name: /rov/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /sensors/camera/image_raw
  gz_topic_name: /rov/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sensors/camera/camera_info
  gz_topic_name: /rov/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# Thruster commands [N], one per Gazebo Thruster system.
- ros_topic_name: /model/rov/joint/thruster1_joint/cmd_thrust
  gz_topic_name: /model/rov/joint/thruster1_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
