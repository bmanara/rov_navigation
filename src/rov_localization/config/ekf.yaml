# robot_localization EKF: IMU + DVL + depth -> /odometry/filtered, TF odom -> base_link
#
# State vector order for *_config:
#   [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
#
# Observability: z (depth), roll/pitch/yaw (IMU, absolute), body velocities
# (DVL), angular rates (IMU). x/y are dead-reckoned from DVL velocity, so they
# drift slowly; the autonomy stack can correct that via map -> odom later.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false          # full 3D
    publish_tf: true           # overridden to false when use_ground_truth:=true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /sensors/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    twist0: /sensors/dvl
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  true,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 5

    pose0: /sensors/depth/pose
    pose0_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 5
